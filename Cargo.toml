[workspace]
resolver = "3"
members = ["contracts/site", "contracts/factory", "contracts/escrow", "contracts/mock-ft"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
near-sdk = "=5.30.2"
near-sdk-contract-tools = "=4.0.0"
# fixed-hash's `std` feature pulls `rand` -> `getrandom`, which refuses
# wasm32-unknown-unknown; U256 arithmetic is core-only, so no std here.
primitive-types = { version = "=0.14.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true
