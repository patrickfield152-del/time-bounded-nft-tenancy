[package]
name = "stele-factory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-sdk-contract-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# No dependency on the site or escrow contract crates: cargo-near builds every
# dependency with `near-sdk/__abi-generate`, and two contract crates in one
# graph export duplicate `__near_abi_*` symbols, which fails the link step.
# The two wire types are declared locally with identical JSON shapes.
